name: Dokkaebi World Discord notices

on:
  schedule:
    # Every 10 minutes (UTC), offset to avoid the top-of-hour rush.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokkaebi-world-notice-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check new posts and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Store observed posts
        if: always()
        run: |
          if [[ -n "$(git status --porcelain seen_posts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_posts.json
            git commit -m "Track Dokkaebi World notices"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
